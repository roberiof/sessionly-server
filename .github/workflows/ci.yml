  secret-scan:
    name: Secret scan (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  zap-scan:
    name: OWASP ZAP API scan
    runs-on: ubuntu-latest
    needs: [quality, database]
    if: github.ref == 'refs/heads/main' || github.base_ref == 'main'
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sessionly_server
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/sessionly_server
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      JWT_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_DAYS: 7
      NODE_ENV: production
      PORT: 3002
      HOST: 0.0.0.0
      CORS_ORIGIN: http://localhost:3000
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Build
        run: pnpm run build

      - name: Run migrations
        run: pnpm prisma migrate deploy

      - name: Start app
        run: nohup pnpm run start:prod &

      - name: Wait for app to be ready
        run: npx wait-on http://localhost:3002/docs-json --timeout 30000

      - name: ZAP API scan
        uses: zaproxy/action-api-scan@v0.9.0
        with:
          target: 'http://localhost:3002/docs-json'
          format: openapi
          fail_action: false
          cmd_options: '-I'

      - name: Upload ZAP report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zap-report
          path: report_html.html
