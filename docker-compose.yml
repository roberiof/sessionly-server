services:
  postgres:
    image: postgres:16-alpine
    container_name: sessionly-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: sessionly_server
    ports:
      - "5432:5432"
    volumes:
      - sessionly_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sessionly_server"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  sessionly_pgdata:
